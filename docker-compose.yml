services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nexuscrm
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password   # local development only; never reuse outside your laptop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuscrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Scalar and the debug endpoints
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nexuscrm;Username=nexus;Password=nexus_dev_password"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
